name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
      packages: write # GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which trusted publishing needs
          node-version: "24"
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test

      - name: Check the release tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish to npmjs.com
        run: npm publish --access public

      # GitHub's npm registry only accepts scoped names, so publish there as @zkm/motd-forge
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm pkg set name=@zkm/motd-forge
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
